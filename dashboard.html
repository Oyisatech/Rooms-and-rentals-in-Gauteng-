
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Landlord Dashboard | Gauteng Rentals</title>
<link rel="stylesheet" href="style.css">

<style>
main {
  max-width:900px;
  margin:35px auto;
  padding:20px;
}
.panel {
  background:white;
  padding:22px;
  border-radius:12px;
  margin-bottom:25px;
  box-shadow:0 3px 15px #0000000d;
}
.panel input, .panel textarea, .panel select {
  box-sizing:border-box;
  width:100%;
  padding:13px;
  margin:8px 0 15px;
  border:1px solid #ddd;
  border-radius:7px;
  font-size:15px;
}
.panel button {
  background:#123b32;
  color:white;
  border:0;
  border-radius:7px;
  padding:13px 20px;
  font-weight:bold;
  cursor:pointer;
}
.panel button:disabled {
  opacity:.5;
}
.upload-box {
  border:2px dashed #123b32;
  border-radius:10px;
  padding:20px;
  text-align:center;
  margin:10px 0 15px;
}
#photoPreview {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
  gap:10px;
}
#photoPreview img {
  width:100%;
  height:110px;
  object-fit:cover;
  border-radius:8px;
}
.listing {
  border:1px solid #e5e5e5;
  padding:15px;
  border-radius:9px;
  margin:12px 0;
}
.listing img {
  width:100%;
  max-width:180px;
  height:120px;
  object-fit:cover;
  border-radius:8px;
  margin:5px;
}
.status {
  font-weight:bold;
  color:#9b7014;
}
#message {
  margin-top:15px;
  overflow-wrap:anywhere;
}
</style>
</head>

<body>

<header>
<a href="index.html" class="logo">🏠 Gauteng Rentals</a>
<button id="logoutButton">Logout</button>
</header>

<main>
<h1>Landlord Dashboard</h1>
<p>Manage your rental advertisements.</p>

<section class="panel">
<h2>Advertise a property</h2>

<form id="propertyForm">

<label>Property title</label>
<input id="title" required maxlength="100"
placeholder="e.g. Spacious room in Roodepoort">

<label>Property category</label>
<select id="category" required>
<option value="">Select category</option>
<option>Room</option>
<option>Flat</option>
<option>Apartment</option>
<option>House</option>
</select>

<label>City or town</label>
<input id="city" required placeholder="e.g. Johannesburg">

<label>Suburb</label>
<input id="suburb" placeholder="e.g. Roodepoort">

<label>Monthly rent (R)</label>
<input id="rent" type="number" min="1" required placeholder="2500">

<label>Bedrooms</label>
<input id="bedrooms" type="number" min="0" value="1">

<label>Bathrooms</label>
<input id="bathrooms" type="number" min="0" value="1">

<label>WhatsApp phone number</label>
<input id="phone" type="tel" required placeholder="e.g. 0821234567">

<label>Property description</label>
<textarea id="description" rows="4" maxlength="2000"
placeholder="Describe the property, facilities and rental conditions"></textarea>

<label>Property photos</label>

<div class="upload-box">
  <p>📸 Choose photos from your phone</p>
  <input
    id="photos"
    type="file"
    accept="image/jpeg,image/png,image/webp"
    multiple
  >
  <p>Choose up to 5 photos. Maximum 5MB each.</p>
</div>

<div id="photoPreview"></div>

<button type="submit" id="submitButton">
Submit property
</button>

<p id="message" role="status" aria-live="polite"></p>

</form>
</section>

<section class="panel">
<h2>My property listings</h2>
<div id="myProperties">Loading your properties...</div>
</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
const db = window.supabaseClient;
const message = document.getElementById("message");
const photoInput = document.getElementById("photos");
const preview = document.getElementById("photoPreview");

let currentUser = null;

const BUCKET = "property-photos";

async function startDashboard() {
  if (!db) {
    message.textContent = "Supabase connection is missing.";
    return;
  }

  const { data, error } = await db.auth.getUser();

  if (error || !data.user) {
    window.location.replace("landlord.html");
    return;
  }

  currentUser = data.user;
  await loadMyProperties();
}

// Preview selected photos
photoInput.addEventListener("change", () => {
  preview.innerHTML = "";

  const files = Array.from(photoInput.files || []);

  if (files.length > 5) {
    alert("Please select no more than 5 photos.");
    photoInput.value = "";
    return;
  }

  for (const file of files) {
    if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
      alert("Only JPG, PNG and WebP photos are allowed.");
      photoInput.value = "";
      preview.innerHTML = "";
      return;
    }

    if (file.size > 5 * 1024 * 1024) {
      alert("Each photo must be smaller than 5MB.");
      photoInput.value = "";
      preview.innerHTML = "";
      return;
    }
  }

  files.forEach(file => {
    const img = document.createElement("img");
    img.src = URL.createObjectURL(file);
    img.alt = "Property photo preview";
    preview.appendChild(img);
  });
});

// Upload photos directly to Supabase Storage
async function uploadPhotos(files) {
  const imageUrls = [];

  for (let i = 0; i < files.length; i++) {
    const file = files[i];

    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");

    const filePath =
      currentUser.id + "/" + Date.now() + "-" + i + "-" + safeName;

    const { error } = await db.storage
      .from(BUCKET)
      .upload(filePath, file, {
        cacheControl: "3600",
        upsert: false,
        contentType: file.type
      });

    if (error) {
      throw new Error("Photo upload failed: " + error.message);
    }

    const { data } = db.storage
      .from(BUCKET)
      .getPublicUrl(filePath);

    imageUrls.push(data.publicUrl);
  }

  return imageUrls;
}

// Load landlord listings
async function loadMyProperties() {
  const container = document.getElementById("myProperties");

  const { data, error } = await db
    .from("properties")
    .select("*")
    .eq("owner_id", currentUser.id)
    .order("created_at", { ascending: false });

  if (error) {
    container.textContent = "Could not load listings: " + error.message;
    return;
  }

  container.innerHTML = "";

  if (!data || data.length === 0) {
    container.textContent =
      "You haven't submitted any properties yet.";
    return;
  }

  data.forEach(property => {
    const card = document.createElement("div");
    card.className = "listing";

    const title = document.createElement("h3");
    title.textContent = property.title;

    const location = document.createElement("p");
    location.textContent =
      [property.suburb, property.city].filter(Boolean).join(", ");

    const price = document.createElement("p");
    price.textContent =
      "R" + Number(property.rent).toLocaleString("en-ZA") +
      " per month";

    const status = document.createElement("p");
    status.className = "status";
    status.textContent = "Status: " + property.status;

    card.append(title, location, price, status);

    if (Array.isArray(property.image_urls)) {
      property.image_urls.forEach(url => {
        const img = document.createElement("img");
        img.src = url;
        img.alt = "Property photo";
        img.loading = "lazy";
        card.appendChild(img);
      });
    }

    container.appendChild(card);
  });
}

// Submit property and photos
document.getElementById("propertyForm")
.addEventListener("submit", async event => {

  event.preventDefault();

  if (!currentUser) {
    message.textContent = "Please log in again.";
    return;
  }

  const button = document.getElementById("submitButton");
  button.disabled = true;

  try {
    const files = Array.from(photoInput.files || []);

    if (files.length > 5) {
      throw new Error("Maximum 5 photos allowed.");
    }

    message.textContent = "Uploading property photos...";

    const imageUrls = await uploadPhotos(files);

    message.textContent = "Saving your property...";

    const listing = {
      owner_id: currentUser.id,
      title: document.getElementById("title").value.trim(),
      category: document.getElementById("category").value,
      province: "Gauteng",
      city: document.getElementById("city").value.trim(),
      suburb: document.getElementById("suburb").value.trim(),
      rent: Number(document.getElementById("rent").value),
      bedrooms: Number(document.getElementById("bedrooms").value),
      bathrooms: Number(document.getElementById("bathrooms").value),
      contact_phone: document.getElementById("phone").value.trim(),
      description: document.getElementById("description").value.trim(),
      image_urls: imageUrls,
      status: "pending"
    };

    const { error } = await db
      .from("properties")
      .insert(listing);

    if (error) throw error;

    message.textContent =
      "Success! Your property has been submitted for admin approval.";

    event.target.reset();
    preview.innerHTML = "";

    await loadMyProperties();

  } catch (error) {
    message.textContent = "Submission failed: " + error.message;
  } finally {
    button.disabled = false;
  }
});

// Logout
document.getElementById("logoutButton")
.addEventListener("click", async () => {

  const { error } = await db.auth.signOut();

  if (error) {
    alert(error.message);
    return;
  }

  window.location.replace("landlord.html");
});

startDashboard();
</script>

</body>
  </html>
