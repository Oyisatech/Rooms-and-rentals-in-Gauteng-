
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landlord Registration | Gauteng Rentals</title>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 430px;
      margin: 35px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 { text-align: center; color: #123b2b; }

    input {
      width: 100%;
      padding: 13px;
      margin: 9px 0;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 7px;
      background: #137547;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .switch {
      background: none;
      color: #137547;
      text-decoration: underline;
    }

    .message {
      padding: 12px;
      border-radius: 7px;
      margin: 12px 0;
      display: none;
      line-height: 1.5;
    }

    .success {
      background: #e5f7eb;
      color: #126334;
    }

    .error {
      background: #ffe8e8;
      color: #a40000;
    }

    .show-password {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 8px 0;
      font-size: 14px;
    }

    .show-password input {
      width: auto;
      margin: 0;
    }
  </style>
</head>

<body>

<div class="container">
  <h2 id="heading">Landlord Registration</h2>

  <div id="message" class="message"></div>

  <form id="authForm">

    <div id="nameField">
      <input id="fullName" type="text"
        placeholder="Full name">
    </div>

    <div id="phoneField">
      <input id="phone" type="tel"
        placeholder="WhatsApp number">
    </div>

    <input id="email" type="email"
      placeholder="Email address" required>

    <input id="password" type="password"
      placeholder="Password (minimum 8 characters)"
      required>

    <div id="confirmField">
      <input id="confirmPassword" type="password"
        placeholder="Confirm password">
    </div>

    <label class="show-password">
      <input type="checkbox" id="showPassword">
      Show passwords
    </label>

    <button type="submit" id="submitButton">
      Register
    </button>
  </form>

  <button class="switch" type="button" id="switchButton">
    Already have an account? Log in
  </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
  const form = document.getElementById("authForm");
  const heading = document.getElementById("heading");
  const message = document.getElementById("message");
  const submitButton = document.getElementById("submitButton");
  const switchButton = document.getElementById("switchButton");

  const nameField = document.getElementById("nameField");
  const phoneField = document.getElementById("phoneField");
  const confirmField = document.getElementById("confirmField");

  const fullName = document.getElementById("fullName");
  const phone = document.getElementById("phone");
  const email = document.getElementById("email");
  const password = document.getElementById("password");
  const confirmPassword = document.getElementById("confirmPassword");
  const showPassword = document.getElementById("showPassword");

  let loginMode = false;

  function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
    message.style.display = "block";
  }

  function setLoginMode(value) {
    loginMode = value;

    heading.textContent = loginMode
      ? "Landlord Login"
      : "Landlord Registration";

    submitButton.textContent = loginMode
      ? "Log In"
      : "Register";

    nameField.style.display = loginMode ? "none" : "block";
    phoneField.style.display = loginMode ? "none" : "block";
    confirmField.style.display = loginMode ? "none" : "block";

    fullName.required = !loginMode;
    phone.required = !loginMode;
    confirmPassword.required = !loginMode;

    switchButton.textContent = loginMode
      ? "Don't have an account? Register"
      : "Already have an account? Log in";

    showPassword.checked = false;
    password.type = "password";
    confirmPassword.type = "password";
  }

  switchButton.addEventListener("click", function() {
    setLoginMode(!loginMode);
    message.style.display = "none";
  });

  showPassword.addEventListener("change", function() {
    const type = this.checked ? "text" : "password";
    password.type = type;
    confirmPassword.type = type;
  });

  // Detect return from the email confirmation link.
  const queryParams = new URLSearchParams(window.location.search);
  const hashParams = new URLSearchParams(
    window.location.hash.replace(/^#/, "")
  );

  const confirmationReturned =
    queryParams.has("code") ||
    hashParams.get("type") === "signup";

  const confirmationError =
    queryParams.get("error_description") ||
    hashParams.get("error_description");

  if (confirmationError) {
    showMessage(
      "Email confirmation could not be completed: " +
      confirmationError,
      "error"
    );
    setLoginMode(false);
  } else if (confirmationReturned) {
    setLoginMode(true);
    showMessage(
      "Email confirmed successfully! You can now log in.",
      "success"
    );
  }

  form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const client = window.supabaseClient;

    if (!client) {
      showMessage(
        "Connection problem. Please check your Supabase setup.",
        "error"
      );
      return;
    }

    const userEmail = email.value.trim();
    const userPassword = password.value;

    submitButton.disabled = true;
    submitButton.textContent = "Please wait...";

    try {
      if (loginMode) {
        const { data, error } =
          await client.auth.signInWithPassword({
            email: userEmail,
            password: userPassword
          });

        if (error) throw error;

        showMessage("Login successful! Opening your dashboard...", "success");

        window.location.href = "dashboard.html";

      } else {
        if (userPassword.length < 8) {
          throw new Error("Your password must have at least 8 characters.");
        }

        if (userPassword !== confirmPassword.value) {
          throw new Error("Your passwords do not match.");
        }

        const { data, error } = await client.auth.signUp({
          email: userEmail,
          password: userPassword,
          options: {
            data: {
              full_name: fullName.value.trim(),
              phone: phone.value.trim(),
              role: "landlord"
            },
            emailRedirectTo:
              "https://oyisatech.github.io/Rooms-and-rentals-in-Gauteng-/landlord.html"
          }
        });

        if (error) throw error;

        if (data.session) {
          showMessage(
            "Account created successfully! You can now log in.",
            "success"
          );
          setLoginMode(true);
        } else {
          showMessage(
            "Registration received! Check your email and click the confirmation link. Then return here to log in.",
            "success"
          );
        }
      }

    } catch (error) {
      showMessage(error.message, "error");
    } finally {
      submitButton.disabled = false;
      submitButton.textContent = loginMode ? "Log In" : "Register";
    }
  });
</script>

</body>
</html>
